name: WordPress initial setup

on:
  workflow_dispatch: {}

jobs:
  setup:
    name: Inspect site, create required pages, sync news posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query WordPress REST API
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          set -uo pipefail
          AUTH="${WP_USERNAME}:${WP_APP_PASSWORD}"
          BASE="${WP_URL%/}/wp-json"
          echo "Target: $BASE (WP_URL secret = '${WP_URL}')"

          # Calls the REST API and leaves the result in $RESPONSE_BODY.
          # Always prints the HTTP status so a bad response is visible in the
          # log instead of silently crashing a downstream jq call.
          api_call() {
            local method="$1" url="$2" data="${3:-}"
            local tmpfile status
            tmpfile=$(mktemp)
            if [ -n "$data" ]; then
              status=$(curl -sS -u "$AUTH" -X "$method" -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0 (compatible; subsupo-wp-setup/1.0)" -d "$data" -o "$tmpfile" -w '%{http_code}' "$url" || echo "curl_error")
            else
              status=$(curl -sS -u "$AUTH" -X "$method" -H "User-Agent: Mozilla/5.0 (compatible; subsupo-wp-setup/1.0)" -o "$tmpfile" -w '%{http_code}' "$url" || echo "curl_error")
            fi
            echo "  [$method $url] -> HTTP $status"
            if [ "$status" = "curl_error" ] || ! jq -e . "$tmpfile" >/dev/null 2>&1; then
              echo "  !! Response is not valid JSON. First 500 chars of body:"
              head -c 500 "$tmpfile"
              echo
              RESPONSE_BODY="null"
              rm -f "$tmpfile"
              return 1
            fi
            RESPONSE_BODY=$(cat "$tmpfile")
            rm -f "$tmpfile"
            return 0
          }

          echo
          echo "## Active plugins"
          if api_call GET "$BASE/wp/v2/plugins"; then
            echo "$RESPONSE_BODY" | jq -r 'if type=="array" then (.[] | select(.status=="active") | .plugin + "  —  " + .name) else "(unexpected shape: " + (.message // tostring) + ")" end'
          else
            echo "  -> Skipping plugin list (see error above)."
          fi

          echo
          echo "## Registered post types (confirms the subsup theme is active)"
          if api_call GET "$BASE/wp/v2/types"; then
            echo "$RESPONSE_BODY" | jq -r 'keys[]'
          else
            echo "  -> Skipping post type list (see error above)."
          fi

          echo
          echo "## Existing pages"
          if api_call GET "$BASE/wp/v2/pages?per_page=100&status=publish,draft,private"; then
            echo "$RESPONSE_BODY" | jq -r '.[] | .slug + "  (" + .status + ")  #" + (.id|tostring)'
          else
            echo "  -> Skipping page list (see error above)."
          fi

          echo
          echo "## Ensuring the Privacy Policy page exists with the current content"
          EXISTING_PAGE_ID=""
          if api_call GET "$BASE/wp/v2/pages?slug=privacy-policy"; then
            EXISTING_PAGE_ID=$(echo "$RESPONSE_BODY" | jq -r '.[0].id // empty')
          fi
          PRIVACY_JSON=$(cat .github/workflows/data/privacy-policy-page.json)
          if [ -z "$EXISTING_PAGE_ID" ]; then
            if api_call POST "$BASE/wp/v2/pages" "$PRIVACY_JSON"; then
              echo "$RESPONSE_BODY" | jq -r '"Created page id: " + (.id|tostring) + "  link: " + .link'
            else
              echo "  -> Failed to create the privacy policy page (see error above)."
            fi
          else
            if api_call POST "$BASE/wp/v2/pages/${EXISTING_PAGE_ID}" "$PRIVACY_JSON"; then
              echo "$RESPONSE_BODY" | jq -r '"Updated page id: " + (.id|tostring) + "  link: " + .link'
            else
              echo "  -> Failed to update the privacy policy page (see error above)."
            fi
          fi

          echo
          echo "## Existing news posts (before sync)"
          if api_call GET "$BASE/wp/v2/news?per_page=100&status=publish,draft&_fields=id,slug,title,status"; then
            echo "$RESPONSE_BODY" | jq -r '.[] | "#" + (.id|tostring) + "  " + .slug + "  " + .title.rendered'
          else
            echo "  -> Could not list existing news posts (see error above). Aborting news sync."
            exit 1
          fi

          echo
          echo "## Ensuring news_category terms exist"
          get_or_create_term() {
            local name="$1" id=""
            if api_call GET "$BASE/wp/v2/news_category?search=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$name")"; then
              id=$(echo "$RESPONSE_BODY" | jq -r --arg n "$name" '[.[] | select(.name == $n)][0].id // empty')
            fi
            if [ -z "$id" ]; then
              if api_call POST "$BASE/wp/v2/news_category" "{\"name\": \"${name}\"}"; then
                id=$(echo "$RESPONSE_BODY" | jq -r '.id // empty')
              fi
            fi
            echo "$id"
          }
          TERM_HOJOKIN=$(get_or_create_term "補助金情報")
          TERM_OSHIRASE=$(get_or_create_term "お知らせ")
          echo "補助金情報 term id: $TERM_HOJOKIN"
          echo "お知らせ term id: $TERM_OSHIRASE"

          if [ -z "$TERM_HOJOKIN" ] || [ -z "$TERM_OSHIRASE" ]; then
            echo "!! Could not resolve news_category term IDs, aborting news sync."
            exit 1
          fi

          echo
          echo "## Syncing news posts to match the current copy deck"
          jq -c '.[]' .github/workflows/data/news-items.json | while read -r item; do
            SLUG=$(echo "$item" | jq -r '.slug')
            TITLE=$(echo "$item" | jq -r '.title')
            CONTENT=$(echo "$item" | jq -r '.content')
            DATE=$(echo "$item" | jq -r '.date')
            CATEGORY=$(echo "$item" | jq -r '.category')

            if [ "$CATEGORY" = "補助金情報" ]; then
              TERM_ID="$TERM_HOJOKIN"
            else
              TERM_ID="$TERM_OSHIRASE"
            fi

            PAYLOAD=$(jq -n --arg title "$TITLE" --arg slug "$SLUG" --arg content "$CONTENT" --arg date "$DATE" --argjson term "$TERM_ID" \
              '{title: $title, slug: $slug, content: $content, date: $date, status: "publish", news_category: [$term]}')

            EXISTING_ID=""
            if api_call GET "$BASE/wp/v2/news?slug=${SLUG}"; then
              EXISTING_ID=$(echo "$RESPONSE_BODY" | jq -r '.[0].id // empty')
            fi

            if [ -z "$EXISTING_ID" ]; then
              if api_call POST "$BASE/wp/v2/news" "$PAYLOAD"; then
                echo "$RESPONSE_BODY" | jq -r '"Created: #" + (.id|tostring) + "  " + .slug'
              else
                echo "  -> Failed to create '${SLUG}' (see error above)."
              fi
            else
              if api_call POST "$BASE/wp/v2/news/${EXISTING_ID}" "$PAYLOAD"; then
                echo "$RESPONSE_BODY" | jq -r '"Updated: #" + (.id|tostring) + "  " + .slug'
              else
                echo "  -> Failed to update '${SLUG}' (see error above)."
              fi
            fi
          done

          echo
          echo "## News posts after sync (review any slugs NOT in the list above — they are old/unexpected posts left untouched)"
          if api_call GET "$BASE/wp/v2/news?per_page=100&status=publish,draft&_fields=id,slug,title,status"; then
            echo "$RESPONSE_BODY" | jq -r '.[] | "#" + (.id|tostring) + "  " + .slug + "  " + .title.rendered'
          fi
